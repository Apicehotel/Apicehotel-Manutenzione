name: RandAI Group 1 Security

on:
  push:
    branches:
      - randai/group1-guardrails-observability
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: randai-group1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: RandTool Gateway contracts
        run: npm run test:group1

      - name: Promptfoo authorization regression gate
        # npm registries can briefly return 404 while a transitive Promptfoo
        # package is propagating. Retry the exact same pinned evaluation; a
        # real regression still fails the job after the bounded attempts.
        run: |
          for attempt in 1 2 3; do
            npm run eval:randai:security && exit 0
            echo "Promptfoo attempt ${attempt}/3 failed; retrying shortly"
            sleep 10
          done
          exit 1

      - name: Governed plugin evaluation report
        if: ${{ !cancelled() }}
        run: npm run eval:plugin

      - name: Upload governed evaluation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rand-plugin-eval-${{ github.sha }}
          path: artifacts/rand-plugin-eval/
          if-no-files-found: error
          retention-days: 14
