name: Install npm dependency v2

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch di destinazione (es. feature/adaptive-quick-actions)"
        required: true
        default: "feature/adaptive-quick-actions"
        type: string
      package:
        description: "Pacchetto npm da installare (es. react-grid-layout)"
        required: true
        type: string
      save_as:
        description: "Dove salvarlo"
        required: true
        default: "dependency"
        type: choice
        options:
          - dependency
          - devDependency

permissions:
  contents: write

jobs:
  install:
    name: Install, verify and commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          PACKAGE_NAME: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_BRANCH" || "$TARGET_BRANCH" == -* || "$TARGET_BRANCH" =~ [[:space:]] ]]; then
            echo "Branch non valido."
            exit 1
          fi
          if [[ -z "$PACKAGE_NAME" || "$PACKAGE_NAME" == -* || "$PACKAGE_NAME" =~ [[:space:]] ]]; then
            echo "Nome pacchetto non valido: usa un singolo package npm, senza spazi o opzioni."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Install requested package
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          SAVE_AS: ${{ inputs.save_as }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SAVE_AS" == "devDependency" ]]; then
            npm install --save-dev -- "$PACKAGE_NAME"
          else
            npm install --save -- "$PACKAGE_NAME"
          fi

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Commit dependency files
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Nessuna modifica a package.json/package-lock.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add npm dependency: ${PACKAGE_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"
