name: Update README and cleanup temporary workflows
on:
  push:
    paths: ['.github/workflows/update-readme-current.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          marker = '### Presenza personale e UI size\n'
          note = '''### Header operativo compatto e RandAI\n\nNelle viste operative mobile il selettore struttura è compatto e non mostra più la seconda riga con utente/ruolo. RandAI viene richiamata nella zona centrale dell'header invece che con un pulsante flottante sopra i contenuti; il pannello si apre sotto l'intestazione. Il comportamento deve rimanere coerente nelle modalità **Piccolo / Normale / Grande** e su iOS, Android e Windows.\n\n'''
          if note.strip() not in s:
              if marker not in s:
                  raise SystemExit('README anchor missing')
              s = s.replace(marker, note + marker, 1)
          p.write_text(s)
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm -f .github/workflows/update-readme-current.yml
          for f in .github/workflows/patch-inventory-native-picker.yml .github/workflows/patch-inventory-photo.yml .github/workflows/patch-issue-resolver-label.yml; do
            [ -f "$f" ] && git rm -f "$f" || true
          done
          git commit -m 'docs: document compact RandAI header and cleanup patch workflows'
          git push origin HEAD:main
