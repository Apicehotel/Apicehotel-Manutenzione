name: RandAI Group 5 RandMind v2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  randmind-v2:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Rand heartbeat start
        id: rand_heartbeat
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randmind --status RUNNING --activity "RandMind v2 checks"
      - name: RandMind v2 contracts
        run: npm run test:group5
      - name: Rand Governance boundary
        run: npm run test:group4
      - name: RandSpec validation
        run: npm run spec:validate

      - name: Rand heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randmind --status IDLE --activity "RandMind v2 checks complete"
      - name: Rand heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randmind --status ERROR --activity "RandMind v2 checks" --detail "Workflow failed"
