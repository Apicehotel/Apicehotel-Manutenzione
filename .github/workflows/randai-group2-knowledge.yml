name: RandAI Group 2 Knowledge

on:
  push:
    branches:
      - randai/group2-knowledge-memory-rag
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: randai-group2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-boundary:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rand heartbeat start
        id: rand_heartbeat
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randmind --status RUNNING --activity "Knowledge and memory checks"

      - name: RandMind production contracts
        run: npm run test:randmind

      - name: Group 1 authorization boundary
        run: npm run test:group1

      - name: Group 2 knowledge boundary
        run: npm run test:group2

      - name: Rand heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randmind --status IDLE --activity "Knowledge checks complete"
      - name: Rand heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randmind --status ERROR --activity "Knowledge and memory checks" --detail "Workflow failed"
