name: RandAI Group 2 Knowledge

on:
  push:
    branches:
      - randai/group2-knowledge-memory-rag
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: randai-group2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: RandMind production contracts
        run: npm run test:randmind

      - name: Group 1 authorization boundary
        run: npm run test:group1

      - name: Group 2 knowledge boundary
        run: npm run test:group2
