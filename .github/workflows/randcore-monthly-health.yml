name: RandCore Monthly Health

on:
  schedule:
    - cron: '45 5 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/randcore-monthly-health.yml'
      - 'scripts/randcore-full-check.mjs'
      - 'test/randai-block15-core-health-59-62.test.js'

permissions:
  contents: read
  id-token: write

jobs:
  full-audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Rand heartbeat start
        id: rand_heartbeat
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randcore --status RUNNING --activity "Monthly ecosystem health audit"
      - name: Validate RandSkills
        run: npm run skills:validate
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Quality matrix
        run: npm run test:matrix
      - name: Critical gate
        run: npm run test:critical
      - name: Multi-hotel gate
        run: npm run test:multihotel
      - name: Production confidence
        run: npm run test:production
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: node scripts/check-bundle.mjs
      - name: Build RandCore audit snapshot
        run: node scripts/randcore-full-check.mjs
      - name: Upload RandCore audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: randcore-monthly-health-${{ github.sha }}
          path: artifacts/randcore-full-check.json
          if-no-files-found: error
          retention-days: 365

      - name: Rand heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randcore --status IDLE --activity "Monthly health audit complete"
      - name: Rand heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randcore --status ERROR --activity "Monthly ecosystem health audit" --detail "Workflow failed"
