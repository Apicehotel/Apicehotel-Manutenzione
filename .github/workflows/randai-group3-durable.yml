name: RandAI Group 3 Durable Runtime

on:
  push:
    branches: [randai/group3-durable-runtime, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: randai-group3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-runtime:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Rand heartbeat start
        id: rand_heartbeat
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randai --status RUNNING --activity "Durable runtime checks"
      - name: Group 1 authorization boundary
        run: npm run test:group1
      - name: Group 2 knowledge boundary
        run: npm run test:group2
      - name: Existing recovery contracts
        run: npm run test:recovery
      - name: Group 3 durable runtime
        run: npm run test:group3

      - name: Rand heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randai --status IDLE --activity "Durable runtime checks complete"
      - name: Rand heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randai --status ERROR --activity "Durable runtime checks" --detail "Workflow failed"
