name: RandDesktop Windows Installer

on:
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/randdesktop-windows.yml'
      - 'test/randdesktop-installer-contract.test.js'
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/randdesktop-windows.yml'
      - 'test/randdesktop-installer-contract.test.js'
  workflow_dispatch:

concurrency:
  group: randdesktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install RandApp dependencies
        run: npm ci

      - name: RandDesktop contract tests
        run: node --test test/randdesktop-printing-contract.test.js test/randdesktop-download-navigation-contract.test.js test/randdesktop-installer-contract.test.js

      - name: Build embedded RandApp
        run: npm run build -- --base=./

      - name: Verify desktop renderer entry
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/index.html')) { throw 'dist/index.html mancante' }
          $html = Get-Content 'dist/index.html' -Raw
          if ($html -match 'src="/assets/' -or $html -match 'href="/assets/') {
            throw 'La build desktop contiene asset Vite assoluti incompatibili con file://'
          }

      - name: Install RandDesktop dependencies
        run: npm install --prefix desktop --no-audit --no-fund

      - name: Validate Electron sources
        run: npm run check --prefix desktop

      - name: Build Windows x64 installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:win --prefix desktop

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'release/randdesktop/*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installer .exe non generato' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content 'release/randdesktop/SHA256SUMS.txt' -Encoding ascii
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "SHA256: $hash"

      - name: Upload RandDesktop installer
        uses: actions/upload-artifact@v4
        with:
          name: RandDesktop-Windows-x64-${{ github.sha }}
          path: |
            release/randdesktop/*.exe
            release/randdesktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
