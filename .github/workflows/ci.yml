name: CI

on:
  push:
    branches:
      - main
      - feature/randai-console-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Quality matrix
        run: npm run test:matrix

      - name: Critical operational gate
        run: npm run test:critical

      - name: Multi-hotel parity gate
        run: npm run test:multihotel

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs

      - name: RandAI Point 3 behavior contracts
        run: node --test test/randai-issue-operations.test.js

      - name: RandAI legacy and platform contracts
        run: node --test $(find test -maxdepth 1 -name 'randai-*.test.js' ! -name 'randai-issue-operations.test.js' -print | sort)

      - name: Shared contracts A-F
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'randai-*.test.js' -print | sort | awk -F/ '$NF ~ /^[A-Fa-f]/')
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Shared contracts G-M
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'randai-*.test.js' -print | sort | awk -F/ '$NF ~ /^[G-Mg-m]/')
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Shared contracts N-S
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'randai-*.test.js' -print | sort | awk -F/ '$NF ~ /^[N-Sn-s]/')
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Shared contracts T-Z
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'randai-*.test.js' -print | sort | awk -F/ '$NF ~ /^[T-Zt-z]/')
          if ((${#files[@]})); then node --test "${files[@]}"; fi

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/apice-vite.log 2>&1 &
          echo $! > /tmp/apice-vite.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/apice-vite.log
          exit 1

      - name: Cross-platform browser gate
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Device acceptance gate
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:device

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: test/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preview server log on failure
        if: failure()
        run: cat /tmp/apice-vite.log || true
