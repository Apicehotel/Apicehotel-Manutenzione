name: CI

on:
  push:
    branches:
      - main
      - feature/randai-console-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Quality matrix
        run: npm run test:matrix

      - name: Critical operational gate
        run: npm run test:critical

      - name: Multi-hotel parity gate
        run: npm run test:multihotel

      - name: Production confidence gate
        run: npm run test:production

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs

      - name: RandBrain production contracts
        run: npm run test:randbrain

      - name: RandUI visual quality contracts
        run: npm run test:randui

      - name: RandAI Point 3 behavior contracts
        run: node --test test/randai-issue-operations.test.js

      - name: RandAI legacy and platform contracts
        shell: bash
        run: |
          set +e
          : > /tmp/randai-contract-failures.txt
          failed=0
          while IFS= read -r test_file; do
            echo "::group::RandAI contract: ${test_file}"
            node --test "$test_file"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "$test_file" | tee -a /tmp/randai-contract-failures.txt
              failed=1
            fi
          done < <(find test -maxdepth 1 -name 'randai-*.test.js' ! -name 'randai-issue-operations.test.js' ! -name 'randai-block12-production-43-46.test.js' -print | sort)

          if [ "$failed" -ne 0 ]; then
            echo "::error title=RandAI contract failures::$(paste -sd ', ' /tmp/randai-contract-failures.txt)"
            cat /tmp/randai-contract-failures.txt
            exit 1
          fi

      - name: Upload RandAI contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: randai-contract-diagnostics-${{ github.sha }}
          path: /tmp/randai-contract-failures.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: RandApp and shared contracts
        shell: bash
        run: |
          set +e
          : > /tmp/shared-contract-failures.txt
          failed=0
          while IFS= read -r test_file; do
            echo "::group::Shared contract: ${test_file}"
            node --test "$test_file"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "$test_file" | tee -a /tmp/shared-contract-failures.txt
              failed=1
            fi
          done < <(find test -maxdepth 1 -name '*.test.js' ! -name 'randai-*.test.js' -print | sort)

          if [ "$failed" -ne 0 ]; then
            echo "::error title=RandApp/shared contract failures::$(paste -sd ', ' /tmp/shared-contract-failures.txt)"
            echo "Failing shared contracts:"
            cat /tmp/shared-contract-failures.txt
            exit 1
          fi

      - name: Upload shared-contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-contract-diagnostics-${{ github.sha }}
          path: /tmp/shared-contract-failures.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/apice-vite.log 2>&1 &
          echo $! > /tmp/apice-vite.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/apice-vite.log
          exit 1

      - name: Cross-platform browser gate
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Device acceptance gate
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:device

      - name: RandCore health evidence snapshot
        run: npm run core:health

      - name: Upload RandCore health evidence
        uses: actions/upload-artifact@v4
        with:
          name: randcore-health-evidence-${{ github.sha }}
          path: artifacts/randcore-full-check.json
          if-no-files-found: error
          retention-days: 365

      - name: RandCore external evidence bridge
        run: npm run core:external-evidence

      - name: Upload RandCore external evidence
        uses: actions/upload-artifact@v4
        with:
          name: randcore-external-evidence-${{ github.sha }}
          path: artifacts/randcore-external-evidence.json
          if-no-files-found: error
          retention-days: 365

      - name: RandCore full health contract gate
        run: npm run test:full-health

      - name: Rand Ecosystem LTS attestation
        env:
          RAND_LTS_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run lts:attest

      - name: Upload Rand Ecosystem LTS attestation
        uses: actions/upload-artifact@v4
        with:
          name: rand-ecosystem-lts-1.0-${{ github.sha }}
          path: artifacts/rand-ecosystem-lts-1.0.json
          if-no-files-found: error
          retention-days: 365

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: test/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preview server log on failure
        if: failure()
        run: cat /tmp/apice-vite.log || true
