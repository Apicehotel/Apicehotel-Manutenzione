name: Materialize App Patches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-app-patches.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply idempotent legacy patches
        run: |
          node scripts/patch-hotel-switch.mjs
          node scripts/patch-issue-filters.mjs

      - name: Commit materialized source if changed
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "App.jsx already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: materialize app patches in source"
          git push origin HEAD:main
