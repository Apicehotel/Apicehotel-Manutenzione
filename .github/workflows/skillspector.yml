name: SkillSpector security scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-agent-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NVIDIA SkillSpector
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/NVIDIA/SkillSpector.git'
      - name: Scan agent skills (static only)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' manifests < <(find . -type f \( -name SKILL.md -o -name skill.md \) -not -path './.git/*' -print0)
          if (( ${#manifests[@]} == 0 )); then
            echo "No agent skills found. SkillSpector scan not applicable."
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            directory="$(dirname "$manifest")"
            echo "::group::Scan $directory"
            skillspector scan "$directory" --no-llm --fail-on-findings
            echo "::endgroup::"
          done
