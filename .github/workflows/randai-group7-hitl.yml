name: RandAI Group 7 HITL Runtime

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: randai-group7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hitl-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Group 7 HITL runtime contracts
        run: node --test test/randai-group7-hitl-runtime.test.js
      - name: Autonomy regression
        run: npm run test:autonomy
      - name: RandAI Group 1 authorization boundary
        run: npm run test:group1
      - name: RandSpec validation
        run: npm run spec:validate
