name: Apply Cyber Cat Orb

on:
  push:
    paths:
      - '.github/workflows/apply-cyber-cat-orb.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch RandAI icon into real header
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('src/randapp/Shell.jsx')
          s = shell.read_text()
          old_import = "import PresenceChip from './PresenceChip.jsx'\n"
          new_import = old_import + "import CyberCatOrb from './CyberCatOrb.jsx'\n"
          if "CyberCatOrb from './CyberCatOrb.jsx'" not in s:
              if old_import not in s:
                  raise SystemExit('PresenceChip import anchor missing')
              s = s.replace(old_import, new_import, 1)
          old_button = '<button type="button" className="rs-header__randai" onClick={() => window.dispatchEvent(new CustomEvent(\'randai-toggle\'))} aria-label="Apri RandAI" data-testid="header-randai"><img src="/icons/randai-cat.webp" alt="" aria-hidden="true" /></button>'
          new_button = '<button type="button" className="rs-header__randai" onClick={() => window.dispatchEvent(new CustomEvent(\'randai-toggle\'))} aria-label="Apri RandAI" data-testid="header-randai"><CyberCatOrb className="rs-cyber-cat-orb" /></button>'
          if old_button in s:
              s = s.replace(old_button, new_button, 1)
          elif new_button not in s:
              raise SystemExit('RandAI header button anchor missing')
          shell.write_text(s)

          css = Path('src/randapp/header-mobile.css')
          c = css.read_text()
          old_block = '''.rs-header__randai {\n  flex: none;\n  width: calc(44px * var(--rs-scale));\n  height: calc(44px * var(--rs-scale));\n  display: grid;\n  place-items: center;\n  padding: calc(4px * var(--rs-scale));\n  border: 1px solid var(--rs-line);\n  border-radius: calc(14px * var(--rs-scale));\n  background: var(--rs-surface-2);\n  color: var(--rs-text);\n  cursor: pointer;\n  box-shadow: none;\n  transition: border-color .2s, transform .12s, background .2s;\n}\n\n.rs-header__randai:hover { border-color: var(--rs-line-strong); }\n.rs-header__randai:active { transform: scale(.94); }\n.rs-header__randai:focus-visible {\n  outline: 3px solid color-mix(in srgb, var(--rs-cyan) 35%, transparent);\n  outline-offset: 2px;\n}\n.rs-header__randai img {\n  width: calc(30px * var(--rs-scale));\n  height: calc(30px * var(--rs-scale));\n  border-radius: calc(9px * var(--rs-scale));\n  object-fit: cover;\n}\n'''
          new_block = '''.rs-header__randai {\n  flex: none;\n  width: calc(44px * var(--rs-scale));\n  height: calc(44px * var(--rs-scale));\n  display: grid;\n  place-items: center;\n  padding: calc(2px * var(--rs-scale));\n  border: 0;\n  border-radius: 50%;\n  background: transparent;\n  color: var(--rs-text);\n  cursor: pointer;\n  box-shadow: none;\n  transition: transform .12s, filter .2s;\n}\n\n.rs-header__randai:hover { filter: brightness(1.08); }\n.rs-header__randai:active { transform: scale(.92); }\n.rs-header__randai:focus-visible {\n  outline: 3px solid color-mix(in srgb, var(--rs-cyan) 35%, transparent);\n  outline-offset: 2px;\n}\n.rs-header__randai .rs-cyber-cat-orb {\n  width: calc(40px * var(--rs-scale));\n  height: calc(40px * var(--rs-scale));\n  display: block;\n  overflow: visible;\n}\n'''
          if old_block in c:
              c = c.replace(old_block, new_block, 1)
          elif '.rs-header__randai .rs-cyber-cat-orb' not in c:
              raise SystemExit('RandAI CSS anchor missing')
          c = c.replace("  .rs-header__randai img {\n    width: calc(var(--rs-header-action-size) - 10px);\n    height: calc(var(--rs-header-action-size) - 10px);\n  }", "  .rs-header__randai .rs-cyber-cat-orb {\n    width: calc(var(--rs-header-action-size) - 2px);\n    height: calc(var(--rs-header-action-size) - 2px);\n  }")
          css.write_text(c)

          test = Path('test/randai-mascot-layout.test.js')
          t = test.read_text()
          t = t.replace("  assert.match(shell, /\\/icons\\/randai-cat\\.webp/)\n", "  assert.match(shell, /CyberCatOrb/)\n  assert.match(shell, /className=\"rs-cyber-cat-orb\"/)\n  assert.doesNotMatch(shell, /randai-cat\\.webp/)\n")
          anchor = "  assert.match(toolbarCss, /\\.rs-header__randai\\{[^}]*width:calc\\(44px\\*var\\(--rs-scale\\)\\);[^}]*height:calc\\(44px\\*var\\(--rs-scale\\)\\)/)\n"
          replacement = anchor + "  assert.match(headerCss, /\\.rs-header__randai \\.rs-cyber-cat-orb\\s*\\{[\\s\\S]*?width:\\s*calc\\(40px \\* var\\(--rs-scale\\)\\)/)\n"
          if 'rs-cyber-cat-orb' not in t:
              t = t.replace(anchor, replacement)
          test.write_text(t)

          readme = Path('README.md')
          r = readme.read_text()
          old = "RandAI è una vera azione della toolbar dell'header, nello stesso gruppo di presenza e notifiche: non usa più un FAB né un launcher riposizionato con `position: fixed`."
          new = "RandAI è una vera azione della toolbar dell'header, nello stesso gruppo di presenza e notifiche: non usa più un FAB né un launcher riposizionato con `position: fixed`. La sua identità visiva nell'header è **Cyber Cat Orb**, resa come SVG vettoriale con anello cyan→viola, volto cyber minimale e circuito centrale, così resta nitida anche nei controlli compatti."
          if old in r:
              r = r.replace(old, new, 1)
          elif 'Cyber Cat Orb' not in r:
              raise SystemExit('README header contract anchor missing')
          readme.write_text(r)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/randapp/Shell.jsx src/randapp/header-mobile.css test/randai-mascot-layout.test.js README.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(ui): use Cyber Cat Orb for RandAI"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/apply-cyber-cat-orb.yml
          git commit -m "chore: remove Cyber Cat Orb patch workflow"
          git push
