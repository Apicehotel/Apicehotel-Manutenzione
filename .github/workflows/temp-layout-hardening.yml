name: temp-layout-hardening
on: [push]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/temp-layout-hardening.py
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/randapp/Shell.jsx src/randapp/shell.css src/randapp/Home.jsx src/randapp/insert-form.css src/randapp/housekeeping-alert.css test/housekeeping.test.js test/issues-layout.test.js test/layout-hardening.test.js
          git diff --cached --quiet || git commit -m "Harden RandApp layout flow across screens"
          git push
