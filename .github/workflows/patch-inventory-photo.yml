name: Wire inventory photo UI
on:
  push:
    paths: ['.github/workflows/patch-inventory-photo.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Patch photo UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/randapp/InventoryView.jsx'); s=p.read_text()
          s=s.replace("import { adjustInventoryStock, createInventoryItem, fetchInventoryItems, fetchInventoryMovements, subscribeInventory } from '../inventory-data.js'", "import { adjustInventoryStock, createInventoryItem, fetchInventoryItems, fetchInventoryMovements, getInventoryPhotoUrl, subscribeInventory } from '../inventory-data.js'")
          s=s.replace("notes: '' }", "notes: '', photo: null }")
          anchor='''        <Field label="Codice / SKU (facoltativo)"><TextInput value={draft.sku} onChange={(e) => setDraft({ ...draft, sku: e.target.value })} /></Field>'''
          photo='''        <Field label="Foto articolo (facoltativa)"><label className="rs-inventory-photo-picker"><input type="file" accept="image/*" capture="environment" onChange={(e) => setDraft({ ...draft, photo: e.target.files?.[0] || null })} /><Icon name="camera" /><span><strong>{draft.photo ? draft.photo.name : 'Scatta o scegli una foto'}</strong><small>Fotografa la scatola, l'etichetta o il ricambio per riconoscerlo subito.</small></span></label></Field>'''
          if anchor not in s: raise SystemExit('SKU anchor missing')
          s=s.replace(anchor, anchor+'\n'+photo,1)
          # Photo URL component, private signed URL.
          insert='''\nfunction InventoryPhoto({ path, className = '' }) {\n  const [url, setUrl] = useState('')\n  useEffect(() => { let alive = true; setUrl(''); if (path) getInventoryPhotoUrl(path).then((v) => { if (alive) setUrl(v) }).catch(() => {}); return () => { alive = false } }, [path])\n  return url ? <img className={className} src={url} alt="Foto articolo" loading="lazy" /> : <span className={`rs-inventory-photo-placeholder ${className}`}><Icon name="package" /></span>\n}\n'''
          marker='function NewItemSheet('
          s=s.replace(marker, insert+'\n'+marker,1)
          s=s.replace('''      <div className="rs-inventory-balance"><small>Giacenza</small>''','''      {item.photoPath && <InventoryPhoto path={item.photoPath} className="rs-inventory-photo-large" />}\n      <div className="rs-inventory-balance"><small>Giacenza</small>''',1)
          s=s.replace('''<span className="rs-inventory-item__icon"><Icon name="package" /></span>''','''<InventoryPhoto path={item.photoPath} className="rs-inventory-item__photo" />''')
          p.write_text(s)

          p=Path('src/randapp/inventory.css'); s=p.read_text(); s += '''\n.rs-inventory-photo-picker{min-height:82px;border:1px dashed var(--rs-border);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;background:color-mix(in srgb,var(--rs-accent,#25d8ef) 4%,transparent)}.rs-inventory-photo-picker input{position:absolute;opacity:0;pointer-events:none}.rs-inventory-photo-picker>.rs-icon{width:28px;height:28px;color:var(--rs-accent,#25d8ef);flex:0 0 auto}.rs-inventory-photo-picker span{display:grid;gap:3px;min-width:0}.rs-inventory-photo-picker strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rs-inventory-photo-picker small{color:var(--rs-muted);line-height:1.35}.rs-inventory-item__photo,.rs-inventory-photo-placeholder.rs-inventory-item__photo{width:46px;height:46px;border-radius:12px;object-fit:cover;display:grid;place-items:center;background:color-mix(in srgb,var(--rs-accent,#25d8ef) 10%,transparent);color:var(--rs-accent,#25d8ef);overflow:hidden}.rs-inventory-photo-large{width:100%;max-height:240px;object-fit:contain;border-radius:16px;background:var(--rs-surface-2);margin-bottom:12px}.rs-inventory-photo-placeholder .rs-icon{width:20px}@media(max-width:360px){.rs-inventory-item__photo,.rs-inventory-photo-placeholder.rs-inventory-item__photo{width:40px;height:40px}}\n'''; p.write_text(s)
          PY
      - name: Verify
        run: |
          npm ci
          npm run build
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/randapp/InventoryView.jsx src/randapp/inventory.css
          git commit -m "feat(inventory): add item reference photo"
          git push origin main
