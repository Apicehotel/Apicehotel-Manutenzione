name: Dark Shell Full Test

on:
  push:
    branches:
      - feature/randapp-dark-shell-rebuild
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        continue-on-error: true
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/randapp-preview.log 2>&1 &
          echo $! > /tmp/randapp-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/randapp-preview.log
          exit 1

      - name: End-to-end tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Preview server log
        if: always()
        run: cat /tmp/randapp-preview.log || true
