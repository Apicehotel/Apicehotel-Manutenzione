name: Point 2 Issues permission once
on:
  push:
    paths:
      - '.github/workflows/point2-issues-permission-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/randapp/Issues.jsx')
          s=p.read_text()
          s=s.replace("import { can, canSendUrgent, ISSUE_CATEGORIES, ROOM_STATUS_OPTIONS, ISSUE_STATUS_META, URGENCY_META, compressPhotoAsDataUrl } from './helpers.js'", "import { canSendUrgent, ISSUE_CATEGORIES, ROOM_STATUS_OPTIONS, ISSUE_STATUS_META, URGENCY_META, compressPhotoAsDataUrl } from './helpers.js'\nimport { canUser } from '../permissions.js'")
          s=s.replace("const canComplete = can(user, 'complete') || can(user, 'take_charge')", "const canComplete = canUser(user, 'issues', 'complete') || canUser(user, 'issues', 'take_charge')")
          s=s.replace("const canAssign = can(user, 'assign')", "const canDelete = canUser(user, 'issues', 'delete')")
          s=s.replace("{canAssign && <IconButton icon=\"trash\"", "{canDelete && <IconButton icon=\"trash\"")
          s=s.replace("if (createSignal && can(user, 'create'))", "if (createSignal && canUser(user, 'issues', 'create'))")
          s=s.replace("{can(user, 'create') && <Button", "{canUser(user, 'issues', 'create') && <Button")
          if "can(user," in s or "import { can," in s:
              raise SystemExit('legacy can() remains in Issues.jsx')
          p.write_text(s)
          PY
          rm -f .github/workflows/point2-issues-permission-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize issue permission gates"
          git push
