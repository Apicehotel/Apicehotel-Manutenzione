name: Deploy RandApp to DigitalOcean

on:
  push:
    branches:
      - main
      - randui/implementable-preview-ocean
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Ocean candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate RandSkills
        run: npm run skills:validate

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Quality matrix
        run: npm run test:matrix

      - name: Critical operational gate
        run: npm run test:critical

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs

      - name: Full unit and contract suite
        run: npm test

  deploy:
    name: Deploy candidate to Ocean
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Deploy to DigitalOcean App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: randapp
          print_build_logs: true
          print_deploy_logs: true
