name: Deploy RandApp to DigitalOcean

on:
  workflow_dispatch:
  push:
    branches:
      - ocean-deploy

permissions:
  contents: read

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Quality matrix
        run: npm run test:matrix

      - name: Critical operational gate
        run: npm run test:critical

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs

      - name: Full unit and contract suite
        run: npm test

  deploy:
    name: Deploy main
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Resolve existing Ocean app
        id: app
        shell: bash
        run: |
          set -euo pipefail
          target='randapp-b2akx.ondigitalocean.app'
          row="$(doctl apps list --format ID,Spec.Name,DefaultIngress --no-header | grep "$target" | head -n 1 || true)"
          if [ -z "$row" ]; then
            echo "Target DigitalOcean app not found for $target" >&2
            doctl apps list --format ID,Spec.Name,DefaultIngress
            exit 1
          fi
          app_id="$(awk '{print $1}' <<< "$row")"
          app_name="$(awk '{print $2}' <<< "$row")"
          echo "id=$app_id" >> "$GITHUB_OUTPUT"
          echo "name=$app_name" >> "$GITHUB_OUTPUT"
          echo "Resolved DigitalOcean app: $app_name ($app_id)"

      - name: Deploy to DigitalOcean App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: ${{ steps.app.outputs.name }}
          print_build_logs: true
          print_deploy_logs: true
