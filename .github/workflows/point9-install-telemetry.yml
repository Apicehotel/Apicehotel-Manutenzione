name: Point 9 telemetry install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/point9-install-telemetry.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install future telemetry SDKs
        run: npm install --save-exact @sentry/react@10.71.0 @opentelemetry/api@1.9.1 @opentelemetry/sdk-trace-web@2.10.0 @opentelemetry/exporter-trace-otlp-http@0.221.0
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/point9-install-telemetry.yml
          git config user.name 'Apicehotel'
          git config user.email 'appmanutenzioneapice@gmail.com'
          git add package.json package-lock.json .github/workflows/point9-install-telemetry.yml
          git commit -m 'chore: install telemetry foundations'
          git push
