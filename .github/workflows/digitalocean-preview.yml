name: DigitalOcean PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: digitalocean-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Deploy preview to DigitalOcean App Platform
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          deploy_pr_preview: "true"
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Comment preview URL
        if: success()
        uses: actions/github-script@v7
        env:
          APP_JSON: ${{ steps.deploy.outputs.app }}
        with:
          script: |
            const app = JSON.parse(process.env.APP_JSON || '{}')
            const url = app.live_url || app.default_ingress || ''
            if (!url) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🌊 DigitalOcean preview pronta: ${url}`
            })
