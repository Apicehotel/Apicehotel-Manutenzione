name: RandUI Ocean Preview

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to deploy to Ocean preview'
        required: true
        default: 'main'

permissions:
  contents: read
  id-token: write

concurrency:
  group: randui-ocean-preview
  cancel-in-progress: true

env:
  PREVIEW_REF: ${{ github.event.pull_request.head.sha || inputs.ref }}

jobs:
  verify:
    name: Verify RandUI preview candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preview ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality matrix
        run: npm run test:matrix

      - name: Critical operational gate
        run: npm run test:critical

      - name: RandUI contracts
        run: npm run test:randui

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs

  deploy:
    name: Deploy RandUI preview to Ocean
    outputs:
      preview_url: ${{ steps.deploy.outputs.app && fromJson(steps.deploy.outputs.app).live_url }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
    steps:
      - name: Checkout preview ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: RandOps heartbeat start
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randops --status RUNNING --activity "DigitalOcean preview deploy"

      - name: Deploy controlled PR preview to DigitalOcean
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          deploy_pr_preview: "true"
          print_build_logs: "true"
          print_deploy_logs: "true"

      - name: RandOps heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randops --status IDLE --activity "DigitalOcean preview deploy complete"

      - name: RandOps heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randops --status ERROR --activity "DigitalOcean preview deploy" --detail "DigitalOcean deploy failed"

  browser-visual-gate:
    name: Browser visual gate on Ocean
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BASE_URL: ${{ needs.deploy.outputs.preview_url }}
    steps:
      - name: Checkout preview ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Cross-platform browser gate on Ocean
        run: npm run test:e2e

      - name: Device acceptance on Ocean
        run: npm run test:device
