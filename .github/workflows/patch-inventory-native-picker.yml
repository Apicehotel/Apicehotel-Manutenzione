name: Inventory native picker
on:
  push:
    paths: ['.github/workflows/patch-inventory-native-picker.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/randapp/InventoryView.jsx'); s=p.read_text()
          old='''<input type="file" accept="image/*" capture="environment" onChange={(e) => setDraft({ ...draft, photo: e.target.files?.[0] || null })} /><Icon name="camera" /><span><strong>{draft.photo ? draft.photo.name : 'Scatta o scegli una foto'}</strong><small>Fotografa la scatola, l'etichetta o il ricambio per riconoscerlo subito.</small></span>'''
          new='''<input type="file" accept="image/*" onChange={(e) => setDraft({ ...draft, photo: e.target.files?.[0] || null })} /><Icon name="camera" /><span><strong>{draft.photo ? draft.photo.name : 'Aggiungi foto'}</strong><small>Usa il selettore nativo: Libreria foto, Scatta foto oppure File, secondo il dispositivo.</small></span>'''
          if old not in s: raise SystemExit('picker anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: |
          npm ci
          npm run build
          npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/randapp/InventoryView.jsx
          git commit -m "fix(inventory): keep native photo source chooser"
          git push origin main
