name: Taste RandUI dependency refresh
on:
  push:
    branches:
      - feat/taste-skill-randui-20261022
    paths:
      - .github/workflows/taste-security-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/taste-skill-randui-20261022
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh vulnerable compatible dependencies
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=high
          npm run test:randui
          npm run build
      - name: Commit reproducible lockfile fix
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency changes necessary"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): resolve Vite and Hono npm audit advisories"
          git push origin HEAD:feat/taste-skill-randui-20261022
