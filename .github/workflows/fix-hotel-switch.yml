name: Fix hotel switch session

on:
  push:
    branches:
      - fix/hotel-switch-session
    paths:
      - scripts/patch-hotel-switch.mjs
      - .github/workflows/fix-hotel-switch.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/hotel-switch-session
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply targeted patch
        run: node scripts/patch-hotel-switch.mjs
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified App.jsx change
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: switch hotel without logging out"
          git push origin HEAD:fix/hotel-switch-session
