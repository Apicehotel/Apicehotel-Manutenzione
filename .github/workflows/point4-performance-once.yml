name: Point 4 performance once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply refactor
        run: node scripts/apply-point4-v2.mjs
      - name: Validate
        run: |
          npm ci
          npm run build
          node scripts/check-bundle.mjs
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/randapp/App.jsx src/randapp/Shell.jsx src/randapp/operations/UtilityLightViews.jsx vite.config.js scripts/check-bundle.mjs test/performance-architecture.test.js .github/workflows/ci.yml
          git commit -m "perf: lazy load RandApp by feature boundary"
          git push