name: RandAI Group 6 RandResearch

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: randai-group6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Rand heartbeat start
        id: rand_heartbeat
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randresearch --status RUNNING --activity "Research governance checks"
      - name: RandResearch contracts
        run: npm run test:group6
      - name: RandMind v2 boundary
        run: npm run test:group5
      - name: Rand governance boundary
        run: npm run test:group4
      - name: RandSpec validation
        run: npm run spec:validate

      - name: Rand heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randresearch --status IDLE --activity "Research checks complete"
      - name: Rand heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randresearch --status ERROR --activity "Research governance checks" --detail "Workflow failed"
