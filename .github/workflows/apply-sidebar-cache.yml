name: Apply sidebar cache
on:
  push:
    paths:
      - 'scripts/apply-sidebar-cache.mjs'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-sidebar-cache.mjs
      - run: npm run build
      - run: npm test
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/randapp/Shell.jsx
          git commit -m "Fix sidebar and add clear cache"
          git push
