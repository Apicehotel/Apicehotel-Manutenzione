name: Patch issue resolver label

on:
  push:
    paths:
      - '.github/workflows/patch-issue-resolver-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show resolver on completed issue cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/randapp/Issues.jsx')
          s = p.read_text()
          old = '''<span className="rs-issue__meta"><span><Icon name="clock" /> {issue.date}</span>{issue.category && <span>· {issue.category}</span>}</span>'''
          new = '''<span className="rs-issue__meta"><span><Icon name="clock" /> {issue.date}</span>{issue.category && <span>· {issue.category}</span>}{issue.status === 'done' && issue.completedBy && <span>· Risolta da <strong>{issue.completedBy}</strong></span>}</span>'''
          if old not in s:
              raise SystemExit('Target markup not found; refusing broad rewrite')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm run build
      - run: npm test
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/randapp/Issues.jsx
          git diff --cached --check
          git commit -m 'fix(issues): show resolver on completed cards'
          git push origin HEAD:main
