name: Repo Radar Weekly

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Repo Radar snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run repo:radar
      - name: Upload Repo Radar evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-radar-${{ github.run_id }}
          path: artifacts/repo-radar/latest.json
          retention-days: 90
