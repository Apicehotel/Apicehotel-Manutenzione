name: Repo Radar Weekly

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Rand heartbeat start
        id: rand_heartbeat
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randradar --status RUNNING --activity "Repository radar scan"
      - name: Validate RandSkills
        run: npm run skills:validate
      - name: Build Repo Radar snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run repo:radar
      - name: Upload Repo Radar evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-radar-${{ github.run_id }}
          path: artifacts/repo-radar/latest.json
          retention-days: 90

      - name: Rand heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randradar --status IDLE --activity "Repository radar scan complete"
      - name: Rand heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randradar --status ERROR --activity "Repository radar scan" --detail "Workflow failed"
