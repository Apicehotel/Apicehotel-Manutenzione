name: Trial compact header RandAI
on:
  push:
    paths: ['.github/workflows/patch-randai-header-trial.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch compact header and RandAI trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/randapp/Shell.jsx')
          s = p.read_text()
          old = '''        <header className="rs-header">
          <button className="rs-hotelchip" onClick={() => allowedHotels.length > 1 && placement('structure') !== 'off' ? setHotelSheet(true) : setDrawer(true)} data-testid="hotel-chip">
            <img src={logoFor(hotel.id)} alt={hotel.name} />
            <span className="rs-hotelchip__text"><b>{hotel.name}</b><small>{user ? `${firstName(user.name)} · ${user.role || ''}` : 'Caricamento…'}</small></span>
            {allowedHotels.length > 1 && placement('structure') !== 'off' && <span className="rs-hotelchip__caret"><Icon name="chevronDown" /></span>}
          </button>
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}><PresenceChip user={user} /><span className="rs-header-notify"><IconButton icon="bell" label="Notifiche" onClick={() => setNotificationsOpen(true)} data-testid="header-notifications" />{notificationUnread>0&&<span className="rs-header-notify__badge">{notificationUnread>99?'99+':notificationUnread}</span>}</span></div>
        </header>'''
          new = '''        <header className="rs-header">
          <button className="rs-hotelchip rs-hotelchip--compact" onClick={() => allowedHotels.length > 1 && placement('structure') !== 'off' ? setHotelSheet(true) : setDrawer(true)} data-testid="hotel-chip">
            <img src={logoFor(hotel.id)} alt={hotel.name} />
            <span className="rs-hotelchip__text"><b className="rs-hotelchip__short">{hotel.short || hotel.name}</b><b className="rs-hotelchip__full">{hotel.name}</b></span>
            {allowedHotels.length > 1 && placement('structure') !== 'off' && <span className="rs-hotelchip__caret"><Icon name="chevronDown" /></span>}
          </button>
          <div className="rs-header__actions">
            <button type="button" className="rs-randai-header" onClick={() => window.dispatchEvent(new CustomEvent('randai-toggle'))} aria-label="Apri RandAI" data-testid="header-randai"><img src="/icons/randai-cat.webp" alt="" aria-hidden="true" /></button>
            <PresenceChip user={user} />
            <span className="rs-header-notify"><IconButton icon="bell" label="Notifiche" onClick={() => setNotificationsOpen(true)} data-testid="header-notifications" />{notificationUnread>0&&<span className="rs-header-notify__badge">{notificationUnread>99?'99+':notificationUnread}</span>}</span>
          </div>
        </header>'''
          if old not in s:
              raise SystemExit('Shell header anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/randai/RandAIAssistant.jsx')
          s = p.read_text()
          s = s.replace("const EVENT = 'apice-session-changed'", "const EVENT = 'apice-session-changed'\nconst OPEN_EVENT = 'randai-toggle'", 1)
          anchor = '''  useEffect(() => {
    setOpen(false)
    setMessages([])
    setQuery('')
    setBusy(false)
  }, [session?.hotelId, session?.userId])'''
          replacement = anchor + '''\n\n  useEffect(() => {\n    const toggle = () => setOpen((value) => !value)\n    window.addEventListener(OPEN_EVENT, toggle)\n    return () => window.removeEventListener(OPEN_EVENT, toggle)\n  }, [])'''
          if anchor not in s:
              raise SystemExit('RandAI effect anchor missing')
          s = s.replace(anchor, replacement, 1)
          fab = '''\n      <button type="button" className="randai__fab" onClick={() => setOpen((value) => !value)} aria-label="Apri RandAI" data-testid="randai-fab"><img src="/icons/randai-cat.webp" alt="" aria-hidden="true" /></button>'''
          if fab not in s:
              raise SystemExit('RandAI FAB anchor missing')
          s = s.replace(fab, '', 1)
          p.write_text(s)

          p = Path('src/randapp/header-mobile.css')
          s = p.read_text()
          addition = r'''

/* Compact operational header: structure context, RandAI, presence, notifications. */
.rs-header__actions {
  margin-left: auto;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: calc(8px * var(--rs-scale));
}
.rs-hotelchip--compact {
  flex: 0 1 auto;
  width: auto;
  max-width: clamp(150px, 26vw, 230px);
}
.rs-hotelchip--compact .rs-hotelchip__text { display: block; }
.rs-hotelchip--compact .rs-hotelchip__short { display: none; }
.rs-hotelchip--compact .rs-hotelchip__full { display: block; }
.rs-randai-header {
  flex: none;
  width: calc(44px * var(--rs-scale));
  height: calc(44px * var(--rs-scale));
  display: grid;
  place-items: center;
  padding: 3px;
  border: 1px solid color-mix(in srgb, var(--rs-cyan) 38%, var(--rs-line));
  border-radius: calc(14px * var(--rs-scale));
  background: color-mix(in srgb, var(--rs-surface-2) 92%, var(--rs-cyan) 8%);
  cursor: pointer;
  box-shadow: 0 8px 24px -18px color-mix(in srgb, var(--rs-cyan) 75%, transparent);
}
.rs-randai-header img {
  width: calc(34px * var(--rs-scale));
  height: calc(34px * var(--rs-scale));
  border-radius: calc(10px * var(--rs-scale));
  object-fit: cover;
}
.rs-randai-header:active { transform: scale(.94); }
.rs-randai-header:focus-visible { outline: 3px solid color-mix(in srgb, var(--rs-cyan) 40%, transparent); outline-offset: 2px; }

@media (max-width: 899px) {
  .rs-header__actions { gap: calc(6px * var(--rs-scale)); }
  .rs-header .rs-hotelchip--compact {
    flex: 0 1 auto;
    max-width: clamp(92px, calc(114px * var(--rs-scale)), 138px);
    padding: calc(6px * var(--rs-scale)) calc(8px * var(--rs-scale));
    gap: calc(7px * var(--rs-scale));
  }
  .rs-header .rs-hotelchip--compact img {
    width: calc(32px * var(--rs-scale));
    height: calc(32px * var(--rs-scale));
    border-radius: calc(10px * var(--rs-scale));
  }
  .rs-hotelchip--compact .rs-hotelchip__short { display: block; font-family: 'Sora'; font-size: .88rem; white-space: nowrap; }
  .rs-hotelchip--compact .rs-hotelchip__full { display: none; }
  .rs-randai-header {
    width: var(--rs-header-action-size);
    height: var(--rs-header-action-size);
    border-radius: calc(14px * var(--rs-scale));
  }
  .rs-randai-header img {
    width: calc(var(--rs-header-action-size) - 7px);
    height: calc(var(--rs-header-action-size) - 7px);
  }
}

@media (max-width: 430px) {
  .rs-header .rs-hotelchip--compact {
    max-width: clamp(86px, calc(104px * var(--rs-scale)), 122px);
    padding-inline: calc(7px * var(--rs-scale));
  }
  .rs-header .rs-hotelchip--compact img {
    width: calc(30px * var(--rs-scale));
    height: calc(30px * var(--rs-scale));
  }
  .rs-hotelchip--compact .rs-hotelchip__short { font-size: .82rem; }
  .rs-randai-header { border-radius: calc(13px * var(--rs-scale)); }
}
'''
          if 'Compact operational header: structure context' not in s:
              s += addition
          p.write_text(s)

          p = Path('src/randai/randai.css')
          s = p.read_text()
          old_start = ".randai{position:fixed;left:max(18px,env(safe-area-inset-left));right:auto;bottom:calc(var(--rs-nav-h,68px) + var(--rs-safe-bottom,env(safe-area-inset-bottom)) + 16px);z-index:45;font-family:inherit}"
          new_start = ".randai{position:fixed;inset:0;z-index:45;font-family:inherit;pointer-events:none}.randai__panel{pointer-events:auto}"
          if old_start not in s:
              raise SystemExit('RandAI CSS root anchor missing')
          s = s.replace(old_start, new_start, 1)
          s = s.replace(".randai__panel{position:absolute;left:0;right:auto;bottom:calc(var(--rs-fab-h,58px) + 10px);", ".randai__panel{position:fixed;left:24px;right:auto;bottom:24px;", 1)
          s = s.replace("@media(max-width:899px){.randai{left:max(18px,env(safe-area-inset-left));right:auto;bottom:calc(58px + max(6px,min(env(safe-area-inset-bottom,0px),18px)) + 12px)}.randai__panel{position:fixed;left:10px;right:10px;bottom:calc(58px + max(6px,min(env(safe-area-inset-bottom,0px),18px)) + 12px + var(--rs-fab-h,58px) + 10px);", "@media(max-width:899px){.randai__panel{position:fixed;left:10px;right:10px;bottom:calc(var(--rs-nav-h,68px) + max(6px,min(env(safe-area-inset-bottom,0px),18px)) + 12px);", 1)
          s = s.replace("@media(min-width:900px){.randai{left:24px;right:auto;bottom:24px}.randai__panel{left:0;right:auto;bottom:calc(var(--rs-fab-h,58px) + 10px)}}", "@media(min-width:900px){.randai__panel{left:24px;right:auto;bottom:24px}}", 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          marker = "### Presenza personale e UI size\n"
          note = "### Header operativo compatto e RandAI\n\nNelle viste operative il selettore struttura usa una forma compatta: su mobile mostra logo + nome breve della struttura, mentre desktop può mostrare il nome completo. RandAI è richiamata dall'header accanto a presenza e notifiche e non usa più un pulsante flottante sopra i contenuti. Il comportamento deve restare coerente nelle modalità **Piccolo / Normale / Grande** e su iOS, Android e Windows.\n\n"
          if note.strip() not in s:
              if marker not in s:
                  raise SystemExit('README anchor missing')
              s = s.replace(marker, note + marker, 1)
          p.write_text(s)
          PY
      - name: Verify build and tests
        run: |
          npm ci
          npm run build
          npm test
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/randapp/Shell.jsx src/randapp/header-mobile.css src/randai/RandAIAssistant.jsx src/randai/randai.css README.md
          git diff --cached --check
          git commit -m 'feat(ui): move RandAI into compact header'
          git push origin HEAD:main
