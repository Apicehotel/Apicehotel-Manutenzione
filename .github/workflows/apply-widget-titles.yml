name: Apply widget titles

on:
  push:
    paths:
      - '.github/workflows/apply-widget-titles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Home widget titles
        run: python -c "from pathlib import Path; p=Path('src/randapp/Home.jsx'); s=p.read_text(); s=s.replace('<span className=\"rs-widget-weather__icon\">{visual.icon}</span>', '<strong className=\"rs-widget-panel-title\">Meteo</strong><span className=\"rs-widget-weather__icon\">{visual.icon}</span>', 1); s=s.replace('{size === \'L\' && <strong className=\"rs-widget-quick__title\">Azioni rapide</strong>}', '<strong className=\"rs-widget-panel-title\">Azioni rapide</strong>', 1); s=s.replace('.rs-widget-card{border-radius:clamp(15px,2vw,20px)!important}', '.rs-widget-card{position:relative;border-radius:clamp(15px,2vw,20px)!important}.rs-widget-panel-title{position:absolute;top:12px;left:12px;font-size:.78rem;font-weight:800;line-height:1;color:var(--rs-text);white-space:nowrap}.is-editing .rs-widget-panel-title{top:48px}', 1); p.write_text(s)"
      - run: npm run build
      - run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/randapp/Home.jsx
          git commit -m "Add titles to weather and quick actions widgets"
          git push
