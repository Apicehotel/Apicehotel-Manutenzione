name: Align RandAI header docs
on:
  push:
    paths: ['.github/workflows/integrate-randai-header.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = "Nelle viste operative mobile il selettore struttura è compatto e non mostra più la seconda riga con utente/ruolo. RandAI viene richiamata nella zona centrale dell'header invece che con un pulsante flottante sopra i contenuti; il pannello si apre sotto l'intestazione. Il comportamento deve rimanere coerente nelle modalità **Piccolo / Normale / Grande** e su iOS, Android e Windows."
          new = "Nelle viste operative il selettore struttura è compatto e dedicato al solo contesto hotel. RandAI è una vera azione della toolbar dell'header, nello stesso gruppo di presenza e notifiche: non usa più un FAB né un launcher riposizionato con `position: fixed`. Il pannello RandAI resta separato e si apre sotto l'intestazione su mobile. Il comportamento deve rimanere coerente nelle modalità **Piccolo / Normale / Grande** e su iOS, Android e Windows."
          if old not in s:
              raise SystemExit('README header contract anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm -f .github/workflows/integrate-randai-header.yml
          git commit -m 'docs(ui): document native RandAI header action'
          git push origin HEAD:main
