name: RandDesignBridge

on:
  pull_request:
    paths:
      - 'src/randai/design/**'
      - 'src/randai/discovery/repo-radar*'
      - 'src/randapp/randui/**'
      - 'scripts/rand-design-bridge-check.mjs'
      - 'scripts/repo-radar-snapshot.mjs'
      - 'test/randdesign-bridge-v1.test.js'
      - 'test/randai-block14-repo-radar-55-58.test.js'
      - 'docs/architecture/RANDDESIGNBRIDGE_V1.md'
      - 'docs/RAND_RADAR_POLICY.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ooqlfldcrnkudhgjnied.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci

      - name: Rand heartbeat start
        id: rand_heartbeat
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randui --status RUNNING --activity "Design and UI governance checks"
      - run: npm run test:design
      - run: npm run test:repo-radar
      - run: npm run design:check

      - name: Rand heartbeat success
        if: success()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randui --status IDLE --activity "Design and UI checks complete"
      - name: Rand heartbeat failure
        if: failure()
        run: node scripts/rand-agent-heartbeat-cli.mjs --agent randui --status ERROR --activity "Design and UI governance checks" --detail "Workflow failed"
