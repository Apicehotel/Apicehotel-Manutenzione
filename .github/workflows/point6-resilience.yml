name: Point 6 Resilience Hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/point6-resilience.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply resilience improvements
        run: python scripts/point6_apply.py
      - name: Verify point 6
        run: |
          npm test
          npm run build
          node scripts/check-bundle.mjs
      - name: Commit final point 6
        run: |
          rm .github/workflows/point6-resilience.yml
          rm scripts/point6_apply.py
          git config user.name "Apicehotel"
          git config user.email "appmanutenzioneapice@gmail.com"
          git add -A
          git commit -m "feat: harden operational resilience"
          git push origin main
