<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RandApp Login Lab</title><style>:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13233a}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 15% 12%,rgba(181,221,208,.78),transparent 34%),radial-gradient(circle at 88% 18%,rgba(185,211,235,.74),transparent 38%),linear-gradient(145deg,#edf6f2 0%,#edf3f8 52%,#f6f8f7 100%);padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.lab{width:min(100%,460px);margin:0 auto}.switcher{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;margin-bottom:12px;border-radius:16px;background:rgba(255,255,255,.66);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 26px rgba(34,66,70,.10)}.switcher button{height:38px;border:0;border-radius:11px;background:transparent;color:#536473;font:inherit;font-weight:800}.switcher button.active{background:#173f72;color:white;box-shadow:0 4px 12px rgba(23,63,114,.2)}.screen{display:none}.screen.active{display:block}.header{margin-bottom:12px}.header-a{min-height:88px;padding:12px 16px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:rgba(255,255,255,.46);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 36px rgba(34,66,70,.10)}.header-a img{width:64px;height:64px;object-fit:contain;border-radius:14px;flex:0 0 64px}.header-a .copy strong{display:block;font-size:30px;line-height:1;color:#10284b;letter-spacing:-.04em}.header-a .copy span{display:block;margin-top:5px;color:#52687b;font-size:14px;font-weight:700}.header-b{min-height:78px;padding:12px 15px;display:flex;align-items:center;gap:13px;border-radius:20px;background:linear-gradient(135deg,rgba(16,57,103,.96),rgba(23,107,115,.93));box-shadow:0 14px 34px rgba(15,58,92,.20);color:white}.header-b img{width:54px;height:54px;object-fit:contain;border-radius:12px;flex:0 0 54px}.header-b .copy strong{display:block;font-size:28px;line-height:1;letter-spacing:-.04em}.header-b .copy span{display:block;margin-top:4px;font-size:13px;font-weight:700;opacity:.84}.header-c{min-height:58px;padding:8px 2px;display:flex;align-items:center;justify-content:center;gap:10px}.header-c img{width:46px;height:46px;object-fit:contain;border-radius:10px;flex:0 0 46px}.header-c .copy{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.header-c .copy strong{font-size:27px;line-height:1;color:#10284b;letter-spacing:-.04em}.header-c .copy span{font-size:12px;font-weight:800;color:#52687b}.card{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.82);border-radius:24px;box-shadow:0 18px 50px rgba(30,64,70,.13);padding:26px 20px 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.intro{text-align:center;margin-bottom:22px}.intro h1{margin:0 0 6px;font-size:28px;line-height:1.1;letter-spacing:-.03em}.intro p{margin:0;color:#6b756f;font-size:14px}.field{display:flex;align-items:center;gap:11px;height:56px;border:1px solid rgba(192,207,203,.9);border-radius:14px;padding:0 15px;background:rgba(255,255,255,.76);margin-top:12px}.field svg{width:21px;height:21px;color:#657386;flex:0 0 auto}.field input{border:0;outline:0;background:transparent;width:100%;font:inherit;font-size:16px;color:#17243a}.primary,.settings{width:100%;height:56px;border-radius:14px;font:inherit;font-weight:800;font-size:16px}.primary{margin-top:16px;border:0;background:linear-gradient(135deg,#123d74,#176b73);color:#fff;box-shadow:0 9px 24px rgba(18,61,116,.20)}.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#82919a;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:rgba(165,184,181,.55);flex:1}.settings{border:1px solid rgba(177,196,191,.8);background:rgba(255,255,255,.64);color:#17314f;display:flex;align-items:center;justify-content:center;gap:9px}.note{text-align:center;color:#84928d;font-size:11px;margin-top:14px}.source{text-align:center;font-size:11px;color:#687882;margin-top:10px}@media(max-width:360px){.header-a{min-height:76px;padding:10px 12px}.header-a img{width:54px;height:54px;flex-basis:54px}.header-a .copy strong{font-size:26px}.header-b{min-height:70px}.header-b img{width:48px;height:48px;flex-basis:48px}.header-b .copy strong{font-size:25px}.header-c img{width:40px;height:40px;flex-basis:40px}.header-c .copy strong{font-size:23px}.header-c .copy span{font-size:10px}}@media(max-height:700px){.switcher{position:relative;top:auto}.header{margin-bottom:8px}.card{padding:20px 18px 16px}.intro{margin-bottom:14px}.field,.primary,.settings{height:50px}.divider{margin:14px 0}.note{display:none}}</style></head><body><main class="lab"><div class="switcher"><button class="active" data-v="a">A · Brand card</button><button data-v="b">B · Dark shell</button><button data-v="c">C · Compact</button></div><section class="screen active" data-screen="a"><div class="header header-a"><img src="/logos/apicehotel-mascot.png" alt="Apicehotel"><div class="copy"><strong>RandApp</strong><span>Manutenzione</span></div></div><div class="card">__FORM__</div><div class="source">A · pattern brand-card / app shell</div></section><section class="screen" data-screen="b"><div class="header header-b"><img src="/logos/apicehotel-mascot.png" alt="Apicehotel"><div class="copy"><strong>RandApp</strong><span>Manutenzione</span></div></div><div class="card">__FORM__</div><div class="source">B · pattern dark app-header / dashboard shell</div></section><section class="screen" data-screen="c"><div class="header header-c"><img src="/logos/apicehotel-mascot.png" alt="Apicehotel"><div class="copy"><strong>RandApp</strong><span>· Manutenzione</span></div></div><div class="card">__FORM__</div><div class="source">C · pattern compact mobile app bar</div></section></main><template id="form"><div class="intro"><h1>Bentornato</h1><p>Accedi per continuare</p></div><label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input placeholder="Utente"></label><label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input type="password" inputmode="numeric" placeholder="PIN"></label><button class="primary">ACCEDI</button><div class="divider">oppure</div><button class="settings">⚙ Impostazioni</button><div class="note">Preview grafica · nessun accesso reale</div></template><script>const html=document.querySelector('#form').innerHTML;document.querySelectorAll('.card').forEach(c=>c.innerHTML=html);document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switcher button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.dataset.screen===b.dataset.v))})</script></body></html>
