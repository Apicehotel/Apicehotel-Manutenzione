server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Hashed Vite bundles and static media must 404 when missing — never SPA index.html.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ^~ /icons/ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ^~ /logos/ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ^~ /sounds/ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    types { application/javascript js; }
    default_type application/javascript;
  }
  location = /manifest.webmanifest {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://ntfy.sh https://*.ntfy.sh https://*.ingest.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
